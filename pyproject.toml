[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuron-framework"
dynamic = ["version"]
description = "A composable agent framework inspired by cognitive neuroscience"
readme = "README.md"
requires-python = ">=3.10"
license-files = ["LICENSE.md"]
authors = [{ name = "Shalini Ananda" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.24",
    "psutil>=5.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Hugging Face model providers (neuron.model_providers.huggingface_provider)
models = ["torch>=2.2", "transformers>=4.40"]
# `neuron webui`
web = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "black>=24.0",
    "isort>=5.13",
    "flake8>=7.0",
]

[project.urls]
Homepage = "https://github.com/ShaliniAnandaPhD/Neuron"
Issues = "https://github.com/ShaliniAnandaPhD/Neuron/issues"
Source = "https://github.com/ShaliniAnandaPhD/Neuron"

[project.scripts]
neuron = "neuron.cli:main"

[tool.setuptools.dynamic]
version = { attr = "neuron.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neuron = ["config/*.yaml", "docs/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312", "py313"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
