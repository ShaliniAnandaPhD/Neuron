name: "🧱⚡ Advanced Neuron LEGO Agent Builder v2.0"

# Adds a use case to agents/use_cases/ for the shared Neuron industry agent
# (agents/neuron_agent.py), runs the agent tests, and commits the new file.
# See agents/README.md.

on:
  workflow_dispatch:
    inputs:
      industry:
        description: "Industry"
        required: true
        type: choice
        options:
          - "Healthcare"
          - "Financial"
          - "Insurance"
          - "Legal"
          - "Manufacturing"
          - "Retail"
      use_case:
        description: "Use case name, e.g. Clinical Decision Support"
        required: true
        type: string
      description:
        description: "One sentence on what the use case delivers"
        required: true
        type: string
      behavior_profile:
        description: "Behavior profile"
        required: true
        type: choice
        options:
          - "balanced"
          - "explorer"
          - "analyst"
      compliance_standards:
        description: "Comma separated standards (leave blank for the industry default)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  add-use-case:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Write use case config
        working-directory: agents
        env:
          INDUSTRY: ${{ inputs.industry }}
          USE_CASE: ${{ inputs.use_case }}
          DESCRIPTION: ${{ inputs.description }}
          PROFILE: ${{ inputs.behavior_profile }}
          COMPLIANCE: ${{ inputs.compliance_standards }}
        run: |
          args=(--industry "$INDUSTRY" --use-case "$USE_CASE" --description "$DESCRIPTION" --profile "$PROFILE")
          if [ -n "$COMPLIANCE" ]; then
            args+=(--compliance "$COMPLIANCE")
          fi
          CONFIG_PATH=$(python add_use_case.py "${args[@]}")
          echo "CONFIG_PATH=$CONFIG_PATH" >> "$GITHUB_ENV"
          cat "$CONFIG_PATH"

      - name: Test every use case
        working-directory: agents
        run: |
          pip install -r requirements.txt
          python -m pytest test_neuron_agent.py -v
          python neuron_agent.py --use-case "$(basename "$CONFIG_PATH" .json)" --smoke-test

      - name: Commit use case
        env:
          INDUSTRY: ${{ inputs.industry }}
          USE_CASE: ${{ inputs.use_case }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$CONFIG_PATH"
          git commit -m "feat(agents): add $INDUSTRY use case: $USE_CASE"
          git push

      - name: Summary
        env:
          INDUSTRY: ${{ inputs.industry }}
          USE_CASE: ${{ inputs.use_case }}
        run: |
          KEY=$(basename "$CONFIG_PATH" .json)
          {
            echo "## Added $INDUSTRY use case: $USE_CASE"
            echo
            echo '```json'
            cat "$CONFIG_PATH"
            echo '```'
            echo
            echo "Run it with:"
            echo
            echo '```bash'
            echo "cd agents && python neuron_agent.py --use-case $KEY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
